<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Hạng mục - Tổ Thí nghiệm Điện</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px; }
        select, input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .task-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; align-items: center; }
        .system-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-bolt"></i> Tổ Thí nghiệm Điện - Quản lý Hạng mục</h2>
    
    <form id="taskForm" class="grid-form">
        <input type="text" id="taskInput" placeholder="Tên hạng mục..." required>
        <select id="systemSelect">
            <option value="S1">Tổ máy S1</option>
            <option value="S2">Tổ máy S2</option>
            <option value="S3">Tổ máy S3</option>
            <option value="Common">Hệ thống chung</option>
            <option value="Fuel">Hệ thống nhiên liệu</option>
        </select>
        <select id="priority">
            <option value="High">Cao</option>
            <option value="Medium">Trung bình</option>
        </select>
        <button type="submit" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;">Thêm</button>
    </form>

    <div id="stats" style="margin-bottom: 20px; font-weight: 600; color: #475569;"></div>

    <div id="taskList"></div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('lab_tasks')) || [];

    document.getElementById('taskForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newTask = {
            id: Date.now(),
            text: document.getElementById('taskInput').value,
            system: document.getElementById('systemSelect').value,
            priority: document.getElementById('priority').value
        };
        tasks.push(newTask);
        save();
    });

    function save() {
        localStorage.setItem('lab_tasks', JSON.stringify(tasks));
        render();
    }

    function render() {
        const list = document.getElementById('taskList');
        const stats = document.getElementById('stats');
        list.innerHTML = tasks.map(t => `
            <div class="task-item">
                <div><strong>${t.text}</strong> <span class="system-badge">${t.system}</span></div>
                <button onclick="deleteTask(${t.id})" style="color:red; border:none; cursor:pointer;">Xóa</button>
            </div>
        `).join('');
        
        // Thống kê nhanh
        const count = tasks.reduce((acc, t) => { acc[t.system] = (acc[t.system] || 0) + 1; return acc; }, {});
        stats.innerHTML = `Số lượng tồn tại: ${Object.entries(count).map(([k, v]) => `${k}: ${v}`).join(' | ')}`;
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        save();
    }

    render();
</script>
</body>
</html>
